# https://github.com/calamares/calamares/blob/calamares/src/modules/fstab/fstab.conf
---

mountOptions:
    default: defaults,noatime
    ext4: defaults,noatime,errors=remount-ro
    btrfs: defaults,noatime,compress=lzo
    default_swap: defaults,noatime

efiMountOptions: umask=0077

ssdExtraMountOptions:
    ext4: discard
    btrfs: discard=async,ssd
    
crypttabOptions: luks
