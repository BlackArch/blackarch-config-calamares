# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Carry "safe graphics" kernel parameters from the live session over to the
# installed system.
#
# If the live ISO was booted with e.g. "nomodeset i915.modeset=0", the
# installed system usually needs the same parameters to reach a desktop.
# This job reads the live kernel command line (/proc/cmdline is the live
# kernel's, since /proc is mounted inside the target by the mount module)
# and appends the graphics-related parameters to GRUB_CMDLINE_LINUX_DEFAULT
# in the target's /etc/default/grub.
#
# It must run BEFORE grubcfg: grubcfg (with overwrite: false) keeps every
# parameter it finds in GRUB_CMDLINE_LINUX_DEFAULT, and bootloader then runs
# grub-mkconfig, so the parameters end up in /boot/grub/grub.cfg.
#
# Only these are copied: nomodeset, <module>.modeset=<x>, modprobe.blacklist=,
# video=. Live-only options (archiso*, copytoram, cow_spacesize, ...) are not.
# Nothing happens on a normal boot.
#
# IMPORTANT: the command below must not contain the dollar character at all.
# Calamares expands every "$word" in shellprocess commands as one of its own
# variables (even inside single quotes, and "$$" does not escape it), and
# aborts the installation on unknown ones. That is why this is awk using
# getline and plain variables instead of shell variables or awk fields.
#
# The leading "-" means a failure here is logged but does not abort the
# installation.
---
dontChroot: false
timeout: 30
verbose: true

i18n:
    name: "Keeping safe graphics boot options"

script:
    - command: |
        -awk -v F=/etc/default/grub '
        function merge(cur, extra,    t, n, i, r) {
          gsub(/["\047]/, "", cur)
          n = split(cur " " extra, t, " ")
          r = ""
          for (i = 1; i <= n; i++)
            if (index(" " r " ", " " t[i] " ") == 0)
              r = (r == "" ? t[i] : r " " t[i])
          return r
        }
        BEGIN {
          getline c < "/proc/cmdline"
          n = split(c, a, " ")
          add = ""
          for (i = 1; i <= n; i++)
            if (a[i] == "nomodeset" || a[i] ~ /^[^=]+\.modeset=/ || a[i] ~ /^modprobe\.blacklist=/ || a[i] ~ /^video=/)
              add = add " " a[i]
          if (add == "") {
            print "no safe graphics parameters on the live cmdline, nothing to do"
            exit 0
          }
          out = ""
          new = ""
          while ((getline l < F) > 0) {
            if (new == "" && l ~ /^GRUB_CMDLINE_LINUX_DEFAULT=/) {
              new = merge(substr(l, 28), add)
              l = "GRUB_CMDLINE_LINUX_DEFAULT=\"" new "\""
            }
            out = out l "\n"
          }
          close(F)
          if (new == "") {
            new = merge("", add)
            out = out "GRUB_CMDLINE_LINUX_DEFAULT=\"" new "\"\n"
          }
          printf "%s", out > F
          close(F)
          print "GRUB_CMDLINE_LINUX_DEFAULT is now: " new
        }'
      timeout: 30
