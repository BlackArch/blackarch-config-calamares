#
# https://github.com/calamares/calamares/blob/calamares/src/modules/shellprocess/shellprocess.conf
#
# Rewrite every file in /boot without sparse regions.
#
# unpackfs copies with `rsync -aHAXSr` (the S is --sparse), which seeks
# over runs of zeros instead of writing them. A bzImage is zero-padded at
# the end, so vmlinuz-linux lands on the target with its final block
# unbacked by any extent, and the file extended to i_size by truncation.
#
# On ext4 that is harmless: GRUB's ext2 driver returns zeros for holes.
# On btrfs with NO_HOLES (set by default by mkfs.btrfs) the tail is not
# recorded at all, so GRUB's btrfs driver runs out of extents before
# reaching i_size and refuses to boot:
#
#   error: loader/efi/linux.c:551:premature end of file /@/boot/vmlinuz-linux.
#   error: loader/efi/linux.c:412:you need to load the kernel first.
#
# Observed with filefrag on an affected install: a 17240576-byte
# vmlinuz-linux backed by a single extent of 4209 blocks (17240064
# bytes), 512 bytes short. After a non-sparse rewrite the extent covers
# 4210 blocks and flags read "last,eof", and the system boots.
#
# The -S is hardcoded in unpackfs, so this cannot be fixed in
# unpackfs.conf. Applied to all filesystems: it is a no-op where the
# files are already contiguous, and cheap either way.
#
# -xdev stops this descending into the ESP mounted at /boot/efi.
---

dontChroot: false
timeout: 300
verbose: true

i18n:
    name: "Rewriting boot files without sparse regions"

# No '$' anywhere in these commands. shellprocess runs every command
# through a KWordMacroExpander built with '$' as its escape character, so
# a shell positional like "$1" is read as a Calamares variable and the
# job aborts before running:
#
#   The commands use variables that are not defined.
#   Missing variables are: 1,1,1,1.
#
# GNU find substitutes every occurrence of {} in the -exec argument, so
# the filename can be placed directly inside the sh -c string instead.
script:
    - "find /boot -xdev -type f -exec sh -c 'cp --sparse=never \"{}\" \"{}.unsparse\" && mv -f \"{}.unsparse\" \"{}\"' ';'"
    - "sync"
